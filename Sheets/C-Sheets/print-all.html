<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>C Reference — Print All</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/c-cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/cover.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-makefile.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cmake.min.js" defer></script>
		<link rel="stylesheet" href="../CSS/print-all.css" />
		<style>
			/* Grouped TOC page for the 98-sheet set. index.html builds its TOC with
			   a script that doesn't run when injected, so the TOC is rebuilt here,
			   with styles scoped to #toc-page so they don't touch the print-all body. */
			#toc-page { display: flex; flex-direction: column; }
			#toc-page .toc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in; }
			#toc-page .toc-group { margin-bottom: 6px; break-inside: avoid; }
			#toc-page .toc-group-head {
				display: flex; gap: 7px; padding: 3px 7px; margin-bottom: 3px;
				background: rgba(92, 107, 192, 0.12); border-left: 3px solid var(--accent-primary);
			}
			#toc-page .g-name {
				font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
				text-transform: uppercase; color: var(--accent-purple);
			}
			#toc-page .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
			#toc-page .toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
			#toc-page .toc-entry {
				display: flex; gap: 4px; align-items: center; padding: 2px 4px; overflow: hidden;
				border: 1px solid var(--border-section); border-radius: 3px;
			}
			#toc-page .toc-num { font-family: var(--font-code); font-size: 7.5px; font-weight: 700; color: var(--accent-purple); }
			#toc-page .toc-title { font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		</style>
	</head>
	<body>
		<div id="print-bar">
			<a href="index.html" id="back-link">← Index</a>
			<span id="bar-title">C Reference · Print All</span>
			<span id="status"></span>
			<button id="print-btn" type="button">Print All</button>
		</div>

		<div id="sheets-container"></div>

		<script>
			const btn = document.getElementById('print-btn');
			const status = document.getElementById('status');
			const container = document.getElementById('sheets-container');
			const parser = new DOMParser();
			const injectedStyles = new Set();
			const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

			async function injectPage(url) {
				const html = await fetch(url).then(r => r.text());
				const doc = parser.parseFromString(html, 'text/html');
				doc.querySelectorAll('head style').forEach(style => {
					const key = style.textContent.trim().slice(0, 60);
					if (!injectedStyles.has(key)) {
						injectedStyles.add(key);
						const s = document.createElement('style');
						s.textContent = style.textContent;
						document.head.appendChild(s);
					}
				});
				const wrapper = document.createElement('div');
				wrapper.className = 'sheet-page';
				const bodyId = doc.body.getAttribute('id');
				if (bodyId) wrapper.id = bodyId;
				wrapper.innerHTML = doc.body.innerHTML;
				return wrapper;
			}

			function buildTocPage({ title, count, groups, pages }) {
				const pad = n => String(n).padStart(2, '0');
				const page = document.createElement('div');
				page.className = 'sheet-page';
				page.id = 'toc-page';
				const blocks = groups.map(g => {
					const a = g.sheets[0], b = g.sheets[g.sheets.length - 1];
					const chips = g.sheets.map(n =>
						`<div class="toc-entry"><span class="toc-num">${pad(n)}</span>` +
						`<span class="toc-title">${esc(pages[n - 1].title)}</span></div>`).join('');
					return `<div class="toc-group"><div class="toc-group-head"><span class="g-name">${esc(g.title)}</span>` +
						`<span class="g-range">${pad(a)} – ${pad(b)}</span></div><div class="toc-entries">${chips}</div></div>`;
				});
				const split = 9;  // groups 1–9 left (49 sheets), 10–18 right (49 sheets)
				page.innerHTML =
					`<header class="page-header"><div class="sheet-number">C</div><h1>Table of Contents</h1>` +
					`<div class="sheet-desc">${count} sheets · syntax · examples · notes</div></header>` +
					`<main class="toc-cols"><div>${blocks.slice(0, split).join('')}</div>` +
					`<div>${blocks.slice(split).join('')}</div></main>` +
					`<footer class="page-footer"><nav><span></span><span class="nav-toc">${esc(title)} · ${count} Sheets</span><span></span></nav></footer>`;
				return page;
			}

			btn.addEventListener('click', async () => {
				btn.disabled = true;
				status.textContent = 'Loading…';
				container.innerHTML = '';

				try {
					const manifest = await fetch('manifest.json').then(r => r.json());
					const { pages } = manifest;

					// 1. Cover page
					container.appendChild(await injectPage('cover.html'));

					// 2. Blank page
					const blank = document.createElement('div');
					blank.className = 'sheet-page';
					container.appendChild(blank);

					// 3. Grouped TOC built from the manifest
					container.appendChild(buildTocPage(manifest));

					// 4. Sheets
					for (let i = 0; i < pages.length; i++) {
						container.appendChild(await injectPage(pages[i].file));
						status.textContent = `${i + 1} / ${pages.length}`;
					}

					if (window.Prism) Prism.highlightAll();
					// Total = cover (1) + blank (1) + toc (1) + sheets
					status.textContent = `${pages.length + 3} pages ready`;
					btn.disabled = false;
					window.print();
				} catch (err) {
					status.textContent = 'Error: ' + err.message;
					btn.disabled = false;
				}
			});
		</script>
	</body>
</html>
