<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS Reference — Print All</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/css-cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/cover.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
		<link rel="stylesheet" href="../CSS/print-all.css" />
	</head>
	<body>
		<div id="print-bar">
			<a href="index.html" id="back-link">← Index</a>
			<span id="bar-title">CSS REFERENCE · PRINT ALL</span>
			<span id="status"></span>
			<button id="print-btn" type="button">Print All</button>
		</div>

		<div id="sheets-container"></div>

		<script>
			const btn = document.getElementById('print-btn');
			const status = document.getElementById('status');
			const container = document.getElementById('sheets-container');
			const parser = new DOMParser();
			const injectedStyles = new Set();

			async function injectPage(url) {
				const html = await fetch(url).then(r => r.text());
				const doc = parser.parseFromString(html, 'text/html');
				doc.querySelectorAll('head style').forEach(style => {
					const key = style.textContent.trim().slice(0, 60);
					if (!injectedStyles.has(key)) {
						injectedStyles.add(key);
						const s = document.createElement('style');
						s.textContent = style.textContent;
						document.head.appendChild(s);
					}
				});
				const wrapper = document.createElement('div');
				wrapper.className = 'sheet-page';
				const bodyId = doc.body.getAttribute('id');
				if (bodyId) wrapper.id = bodyId;
				wrapper.innerHTML = doc.body.innerHTML;
				return wrapper;
			}

			// Load everything and print. Runs when the page opens; the button re-prints
			// without reloading once everything is in place.
			let loaded = false;

			async function printAll() {
				if (loaded) {
					window.print();
					return;
				}
				btn.disabled = true;
				status.textContent = 'Loading…';
				container.innerHTML = '';

				try {
					const { pages } = await fetch('manifest.json').then(r => r.json());

					// 1. Cover page
					container.appendChild(await injectPage('cover.html'));

					// 2. Blank page
					const blank = document.createElement('div');
					blank.className = 'sheet-page';
					container.appendChild(blank);

					// 3. TOC — built here from manifest.json groups (index.html builds itself
					//    with a script and page-level styles that can't be injected safely)
					const manifest = await fetch('manifest.json').then(r => r.json());
					const toc = document.createElement('div');
					toc.className = 'sheet-page';
					toc.innerHTML = `<header class="page-header"><div class="sheet-number">CSS</div>` +
						`<h1>Table of Contents</h1><div class="sheet-desc">${pages.length} sheets · syntax · examples · notes</div></header>`;
					const grid = document.createElement('div');
					grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:0 0.25in;align-content:start;';
					const half = Math.ceil(pages.length / 2);
					let running = 0, col = document.createElement('div');
					const tocCols = [col];
					for (const g of manifest.groups) {
						if (tocCols.length === 1 && running + g.sheets.length > half + 2) {
							col = document.createElement('div');
							tocCols.push(col);
						}
						running += g.sheets.length;
						const h = document.createElement('div');
						h.className = 'section-title';
						h.style.cssText = 'margin-top:8px;';
						h.textContent = g.title;
						col.appendChild(h);
						for (const n of g.sheets) {
							const p = pages[n - 1];
							const d = document.createElement('div');
							d.style.cssText = 'font-size:10px;padding:2px 10px;border-bottom:1px solid var(--border-table);';
							d.innerHTML = `<span style="font-family:var(--font-code);color:var(--accent-purple)">${String(n).padStart(2, '0')}</span>&nbsp; ${p.title}`;
							col.appendChild(d);
						}
					}
					tocCols.forEach(c => grid.appendChild(c));
					toc.appendChild(grid);
					container.appendChild(toc);

					// 4. Manifest pages
					for (let i = 0; i < pages.length; i++) {
						container.appendChild(await injectPage(pages[i].file));
						status.textContent = `${i + 1} / ${pages.length}`;
					}

					if (window.Prism) Prism.highlightAll();
					// Total = cover (1) + blank (1) + toc (1) + sheets
					loaded = true;
					// Force layout so the injected text requests its fonts, then wait for them
					void document.body.offsetHeight;
					await document.fonts.ready;
					status.textContent = `${pages.length + 3} pages ready`;
					btn.disabled = false;
					window.print();
				} catch (err) {
					status.textContent = 'Error: ' + err.message;
					btn.disabled = false;
				}
			}

			btn.addEventListener('click', printAll);
			// DOMContentLoaded fires after the deferred Prism scripts have run
			document.addEventListener('DOMContentLoaded', printAll);
		</script>
	</body>
</html>
