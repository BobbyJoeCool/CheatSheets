<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Built from INDEX_LARGE_TEMPLATE.html. Everything is driven by manifest.json. -->
		<title>Zsh Reference — Table of Contents</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<style>
			body {
				width: var(--page-width); height: var(--page-height); margin: 20px auto;
				background: var(--bg-body); padding: 0.2in 0.25in calc(var(--footer-height) + 0.3in);
				font-size: 10px; font-family: var(--font-body); color: var(--text-primary);
				-webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
				box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6); box-sizing: border-box; overflow: hidden; position: relative;
			}
			.page-header {
				height: var(--header-height); display: flex; align-items: center; gap: 12px;
				margin-bottom: 10px; border-bottom: 1px solid var(--accent-primary); flex-shrink: 0;
			}
			.page-header .sheet-number {
				font-family: var(--font-code); font-size: 10px; color: var(--accent-purple);
				background: rgba(126, 87, 194, 0.15); border: 1px solid rgba(126, 87, 194, 0.3);
				border-radius: 4px; padding: 2px 8px; white-space: nowrap; flex-shrink: 0;
			}
			.page-header h1 {
				font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary);
				flex: 1; text-align: center; margin: 0;
			}
			.page-header .sheet-desc {
				font-family: var(--font-code); font-size: 10px; color: var(--text-muted);
				text-align: right; white-space: nowrap; flex-shrink: 0;
			}
			#toc-columns {
				flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in;
				align-content: start; overflow: hidden; min-height: 0;
			}
			.toc-group { break-inside: avoid; margin-bottom: 7px; }
			.toc-group-head {
				display: flex; align-items: baseline; gap: 7px; padding: 3px 7px;
				background: rgba(92, 107, 192, 0.12); border-left: 3px solid var(--accent-primary);
				border-radius: 0 3px 3px 0; margin-bottom: 3px;
			}
			.toc-group-head .g-name {
				font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-purple);
			}
			.toc-group-head .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
			.toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
			.toc-entry {
				display: flex; align-items: center; gap: 4px; padding: 2px 5px 2px 4px;
				border: 1px solid var(--border-section); border-radius: 3px; background: var(--bg-section);
				text-decoration: none; color: inherit; overflow: hidden; transition: border-color 0.12s, background 0.12s;
			}
			.toc-entry:hover { border-color: var(--accent-primary); background: rgba(92, 107, 192, 0.08); }
			.toc-num {
				flex-shrink: 0; font-family: var(--font-code); font-size: 7.5px; font-weight: 700;
				color: var(--accent-purple); background: rgba(126, 87, 194, 0.12);
				border: 1px solid rgba(126, 87, 194, 0.2); border-radius: 2px; padding: 0 3px;
				line-height: 14px; letter-spacing: 0.02em;
			}
			.toc-title {
				font-size: 8px; font-weight: 500; color: var(--text-primary); white-space: nowrap;
				overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
			}
			#toc-error { display: none; color: #e57373; font-family: var(--font-code); font-size: 10px; padding: 1rem; }
			.page-footer {
				position: absolute; bottom: 0; left: 0; right: 0; height: var(--footer-height);
				padding: 0 0.25in; display: flex; align-items: center;
				border-top: 1px solid var(--border-section); background: var(--bg-body);
			}
			.page-footer nav { display: flex; width: 100%; align-items: center; justify-content: space-between; }
			.nav-link, .nav-toc { font-family: var(--font-code); font-size: 10px; text-decoration: none; }
			.nav-link { color: var(--text-link); }
			.nav-toc  { color: var(--text-muted); }
			.nav-link.prev::before { content: "‹ "; }
			.nav-link.next::after  { content: " ›"; }
			@media print {
				@page { size: letter portrait; margin: 0; }
				body   { margin: 0; box-shadow: none; }
				.toc-entry { border-color: rgba(0, 0, 0, 0.1); }
			}
			@media screen and (max-width: 767px) {
				body { width: 100%; height: auto; overflow: visible; padding: 12px 10px 60px; box-shadow: none; }
				#toc-columns   { grid-template-columns: 1fr; }
				.toc-entries   { grid-template-columns: 1fr 1fr; }
				.page-footer   { position: fixed; }
			}
		</style>
	</head>
	<body>
		<header class="page-header">
			<div class="sheet-number" id="hdr-lang">ZSH</div>
			<h1 id="hdr-title">Table of Contents</h1>
			<div class="sheet-desc" id="hdr-desc">loading…</div>
		</header>

		<main id="toc-columns" aria-label="Table of contents"></main>
		<div id="toc-error">Error loading manifest.json — see browser console for details.</div>

		<footer class="page-footer">
			<nav aria-label="Sheet navigation">
				<a class="nav-link prev" id="print-all-link" href="print-all.html">Print All</a>
				<a class="nav-toc" id="ftr-toc" href="cover.html">Zsh Reference</a>
				<a class="nav-link next" id="ftr-first" href="#">Sheet 01</a>
			</nav>
		</footer>

		<script>
			document.addEventListener("DOMContentLoaded", async () => {
				let manifest;
				try {
					const res = await fetch("manifest.json");
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					manifest = await res.json();
				} catch (err) {
					document.getElementById("toc-error").style.display = "block";
					document.getElementById("toc-columns").style.display = "none";
					document.getElementById("hdr-desc").textContent = "Error loading manifest";
					console.error("manifest.json load error:", err);
					return;
				}
				const { title = "Reference", lang = "", count, pages = [], groups } = manifest;
				const totalSheets = count ?? pages.length;
				document.title = `${title} — Table of Contents`;
				document.getElementById("hdr-lang").textContent = lang.toUpperCase() || title;
				document.getElementById("hdr-desc").textContent = `${totalSheets} sheets · syntax · examples · notes`;
				document.getElementById("ftr-toc").textContent = `${title} · ${totalSheets} Sheets`;
				if (pages.length) {
					const firstLink = document.getElementById("ftr-first");
					firstLink.href = pages[0].file;
					firstLink.textContent = pages[0].title;
				}
				const byNum = {};
				pages.forEach((p, i) => { byNum[i + 1] = p; });
				buildGrouped(document.getElementById("toc-columns"), groups, byNum, totalSheets);
			});

			function buildGrouped(container, groups, byNum, totalSheets) {
				const half = Math.ceil(totalSheets / 2);
				let running = 0, col1Done = false;
				const col1Groups = [], col2Groups = [];
				for (const g of groups) {
					if (!col1Done && running + g.sheets.length <= half + 2) {
						col1Groups.push(g);
						running += g.sheets.length;
					} else {
						col1Done = true;
						col2Groups.push(g);
					}
				}
				if (!col2Groups.length && col1Groups.length > 1) col2Groups.push(col1Groups.pop());
				container.appendChild(buildColumn(col1Groups, byNum));
				container.appendChild(buildColumn(col2Groups, byNum));
			}

			function buildColumn(groupList, byNum) {
				const col = document.createElement("div");
				col.style.cssText = "display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;";
				for (const g of groupList) {
					const groupPages = g.sheets.map(n => (byNum[n] ? { num: n, ...byNum[n] } : null)).filter(Boolean);
					if (!groupPages.length) continue;
					const first = g.sheets[0], last = g.sheets[g.sheets.length - 1];
					const range = first === last
						? String(first).padStart(2, "0")
						: `${String(first).padStart(2, "0")} – ${String(last).padStart(2, "0")}`;
					const group = document.createElement("div");
					group.className = "toc-group";
					const head = document.createElement("div");
					head.className = "toc-group-head";
					head.innerHTML = `<span class="g-name">${escHtml(g.title)}</span><span class="g-range">${range}</span>`;
					group.appendChild(head);
					const entries = document.createElement("div");
					entries.className = "toc-entries";
					for (const p of groupPages) {
						const a = document.createElement("a");
						a.className = "toc-entry";
						a.href = p.file;
						a.title = p.desc || p.title;
						a.innerHTML = `<span class="toc-num">${String(p.num).padStart(2, "0")}</span>` +
							`<span class="toc-title">${escHtml(p.title)}</span>`;
						entries.appendChild(a);
					}
					group.appendChild(entries);
					col.appendChild(group);
				}
				return col;
			}

			function escHtml(str) {
				return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
			}
		</script>
	</body>
</html>
