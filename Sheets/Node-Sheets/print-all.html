<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Node.js Reference — Print All</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/node-cheatsheet.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-docker.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ini.min.js" defer></script>
		<link rel="stylesheet" href="../CSS/cover.css" />
		<link rel="stylesheet" href="../CSS/print-all.css" />
		<style>
			/* Grouped TOC page (mirrors INDEX_LARGE_TEMPLATE layout) */
			#toc-columns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in; align-content: start; height: auto; }
			.toc-col { display: flex; flex-direction: column; min-width: 0; }
			.toc-group { margin-bottom: 7px; }
			.toc-group-head { display: flex; align-items: baseline; gap: 7px; padding: 3px 7px; background: rgba(92, 107, 192, 0.12); border-left: 3px solid var(--accent-primary); border-radius: 0 3px 3px 0; margin-bottom: 3px; }
			.toc-group-head .g-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-purple); }
			.toc-group-head .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
			.toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
			.toc-entry { display: flex; align-items: center; gap: 4px; padding: 2px 5px 2px 4px; border: 1px solid var(--border-section); border-radius: 3px; background: var(--bg-section); overflow: hidden; }
			.toc-num { flex-shrink: 0; font-family: var(--font-code); font-size: 7.5px; font-weight: 700; color: var(--accent-purple); background: rgba(126, 87, 194, 0.12); border: 1px solid rgba(126, 87, 194, 0.2); border-radius: 2px; padding: 0 3px; line-height: 14px; }
			.toc-title { font-size: 8px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
			.sheet-page.cover-page { padding: 0; }
			.cover-page .page { height: 100%; }
			#toc .page-header .sheet-desc { font-family: var(--font-code); white-space: nowrap; }
		</style>
	</head>
	<!-- For Mermaid/block-layout sheets: use <body class="print-mermaid"> instead.
	     The .print-mermaid .sheet-page rule in print-all.css sets display:block; padding-top:0.5in
	     to accommodate Mermaid diagram rendering. Add this class when any sheet file uses
	     <script type="module"> with a Mermaid import. -->
	<body>
		<div id="print-bar">
			<a href="index.html" id="back-link">← Index</a>
			<span id="bar-title">NODE.JS REFERENCE · PRINT ALL</span>
			<span id="status"></span>
			<button id="print-btn" type="button">Print All</button>
		</div>

		<div id="sheets-container"></div>

		<script>
			const btn = document.getElementById('print-btn');
			const status = document.getElementById('status');
			const container = document.getElementById('sheets-container');
			const parser = new DOMParser();
			const injectedStyles = new Set();


			function esc(str) {
				return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
			}

			// Grouped two-column TOC, same layout as index.html (large model)
			function buildToc({ title, lang, pages, groups }) {
				const page = document.createElement('div');
				page.className = 'sheet-page';
				page.id = 'toc';
				const half = Math.ceil(pages.length / 2);
				const cols = [[], []];
				let running = 0;
				for (const g of groups) {
					const c = cols[1].length || running + g.sheets.length > half + 2 ? 1 : 0;
					cols[c].push(g);
					if (c === 0) running += g.sheets.length;
				}
				const colHtml = cols.map(list => '<div class="toc-col">' + list.map(g => {
					const a = String(g.sheets[0]).padStart(2, '0');
					const b = String(g.sheets[g.sheets.length - 1]).padStart(2, '0');
					const chips = g.sheets.map(n => '<span class="toc-entry"><span class="toc-num">' +
						String(n).padStart(2, '0') + '</span><span class="toc-title">' +
						esc(pages[n - 1].title) + '</span></span>').join('');
					return '<div class="toc-group"><div class="toc-group-head"><span class="g-name">' +
						esc(g.title) + '</span><span class="g-range">' + (a === b ? a : a + ' – ' + b) +
						'</span></div><div class="toc-entries">' + chips + '</div></div>';
				}).join('') + '</div>').join('');
				page.innerHTML =
					'<header class="page-header"><div class="sheet-number">' + esc(lang.toUpperCase()) +
					'</div><h1>Table of Contents</h1><div class="sheet-desc">' + pages.length +
					' sheets · syntax · examples · notes</div></header>' +
					'<main id="toc-columns">' + colHtml + '</main>' +
					'<footer class="page-footer"><nav><span></span><span class="nav-toc">' + esc(title) +
					' · ' + pages.length + ' Sheets</span><span></span></nav></footer>';
				return page;
			}

			async function injectPage(url) {
				const html = await fetch(url).then(r => r.text());
				const doc = parser.parseFromString(html, 'text/html');
				doc.querySelectorAll('head style').forEach(style => {
					const key = style.textContent.trim().slice(0, 60);
					if (!injectedStyles.has(key)) {
						injectedStyles.add(key);
						const s = document.createElement('style');
						s.textContent = style.textContent;
						document.head.appendChild(s);
					}
				});
				const wrapper = document.createElement('div');
				wrapper.className = 'sheet-page';
				const bodyId = doc.body.getAttribute('id');
				if (bodyId) wrapper.id = bodyId;
				wrapper.innerHTML = doc.body.innerHTML;
				return wrapper;
			}

			btn.addEventListener('click', async () => {
				btn.disabled = true;
				status.textContent = 'Loading…';
				container.innerHTML = '';

				try {
					const manifest = await fetch('manifest.json').then(r => r.json());
					const { pages } = manifest;

					// 1. Cover page  [OMIT THIS BLOCK IF cover.html DOES NOT EXIST]
					const cover = await injectPage('cover.html');
					cover.classList.add('cover-page');
					container.appendChild(cover);

					// 2. Blank page  [OMIT THIS BLOCK IF cover.html DOES NOT EXIST]
					const blank = document.createElement('div');
					blank.className = 'sheet-page';
					container.appendChild(blank);

					// 3. TOC — built here from manifest groups (the large-model index.html
					//    renders its TOC with a script, which does not run when injected)
					container.appendChild(buildToc(manifest));

					// 4. Manifest pages
					for (let i = 0; i < pages.length; i++) {
						container.appendChild(await injectPage(pages[i].file));
						status.textContent = `${i + 1} / ${pages.length}`;
					}

					if (window.Prism) Prism.highlightAll();
					// Total = cover (1) + blank (1) + toc (1) + sheets  [adjust if no cover]
					status.textContent = `${pages.length + 3} pages ready`;  // cover + blank + TOC + sheets
					btn.disabled = false;
					window.print();
				} catch (err) {
					status.textContent = 'Error: ' + err.message;
					btn.disabled = false;
				}
			});
		</script>
	</body>
</html>
