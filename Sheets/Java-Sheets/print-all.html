<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Java Reference — Print All</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/java-cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/cover.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-groovy.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-kotlin.min.js" defer></script>
		<link rel="stylesheet" href="../CSS/print-all.css" />
		<style>
			/* Cover page: let .page fill the sheet edge to edge */
			.sheet-page.cover-sheet { padding: 0; }
			.sheet-page.cover-sheet .page { height: 100%; }
			/* Grouped TOC page (mirrors index.html, scoped to the print TOC) */
			.print-toc .page-header .sheet-desc { font-family: var(--font-code); white-space: nowrap; }
			.print-toc #toc-columns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in; align-content: start; overflow: hidden; min-height: 0; }
			.print-toc .toc-group { margin-bottom: 7px; }
			.print-toc .toc-group-head { display: flex; align-items: baseline; gap: 7px; padding: 3px 7px; background: rgba(92,107,192,0.12); border-left: 3px solid var(--accent-primary); border-radius: 0 3px 3px 0; margin-bottom: 3px; }
			.print-toc .g-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-purple); }
			.print-toc .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
			.print-toc .toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
			.print-toc .toc-entry { display: flex; align-items: center; gap: 4px; padding: 2px 5px 2px 4px; border: 1px solid var(--border-section); border-radius: 3px; background: var(--bg-section); overflow: hidden; }
			.print-toc .toc-num { flex-shrink: 0; font-family: var(--font-code); font-size: 7.5px; font-weight: 700; color: var(--accent-purple); background: rgba(126,87,194,0.12); border: 1px solid rgba(126,87,194,0.2); border-radius: 2px; padding: 0 3px; line-height: 14px; }
			.print-toc .toc-title { font-size: 8px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
		</style>
	</head>
	<body>
		<div id="print-bar">
			<a href="index.html" id="back-link">← Index</a>
			<span id="bar-title">JAVA REFERENCE · PRINT ALL</span>
			<span id="status"></span>
			<button id="print-btn" type="button">Print All</button>
		</div>

		<div id="sheets-container"></div>

		<script>
			const btn = document.getElementById("print-btn");
			const status = document.getElementById("status");
			const container = document.getElementById("sheets-container");
			const parser = new DOMParser();
			const pad = (n) => String(n).padStart(2, "0");
			const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

			async function injectPage(url, extraClass) {
				const html = await fetch(url).then((r) => r.text());
				const doc = parser.parseFromString(html, "text/html");
				const wrapper = document.createElement("div");
				wrapper.className = "sheet-page" + (extraClass ? " " + extraClass : "");
				const bodyId = doc.body.getAttribute("id");
				if (bodyId) wrapper.id = bodyId;
				wrapper.innerHTML = doc.body.innerHTML;
				wrapper.querySelectorAll("script").forEach((s) => s.remove());
				return wrapper;
			}

			// Grouped TOC page built from manifest.groups (same layout as index.html)
			function buildToc(m) {
				const page = document.createElement("div");
				page.className = "sheet-page print-toc";
				const cost = (gs) => gs.reduce((a, g) => a + Math.ceil(g.sheets.length / 3) + 1.1, 0);
				let split = 1, best = Infinity;
				for (let i = 1; i < m.groups.length; i++) {
					const worst = Math.max(cost(m.groups.slice(0, i)), cost(m.groups.slice(i)));
					if (worst < best) { best = worst; split = i; }
				}
				const cols = [m.groups.slice(0, split), m.groups.slice(split)];
				const colHtml = cols.map((gs) => "<div>" + gs.map((g) => {
					const first = g.sheets[0], last = g.sheets[g.sheets.length - 1];
					const chips = g.sheets.map((n) =>
						`<span class="toc-entry"><span class="toc-num">${pad(n)}</span><span class="toc-title">${esc(m.pages[n - 1].title)}</span></span>`).join("");
					return `<div class="toc-group"><div class="toc-group-head"><span class="g-name">${esc(g.title)}</span><span class="g-range">${pad(first)} – ${pad(last)}</span></div><div class="toc-entries">${chips}</div></div>`;
				}).join("") + "</div>").join("");
				page.innerHTML =
					`<header class="page-header"><div class="sheet-number">JAVA</div><h1>Table of Contents</h1><div class="sheet-desc">${m.count} sheets · syntax · examples · notes</div></header>` +
					`<main id="toc-columns">${colHtml}</main>` +
					`<footer class="page-footer"><nav><span></span><span class="nav-toc">${esc(m.title)} · ${m.count} Sheets</span><span></span></nav></footer>`;
				return page;
			}

			btn.addEventListener("click", async () => {
				btn.disabled = true;
				status.textContent = "Loading…";
				container.innerHTML = "";
				try {
					const m = await fetch("manifest.json").then((r) => r.json());

					container.appendChild(await injectPage("cover.html", "cover-sheet"));   // 1. cover
					const blank = document.createElement("div");                          // 2. blank
					blank.className = "sheet-page";
					container.appendChild(blank);
					container.appendChild(buildToc(m));                                    // 3. TOC

					for (let i = 0; i < m.pages.length; i++) {                            // 4. sheets
						container.appendChild(await injectPage(m.pages[i].file));
						status.textContent = `${i + 1} / ${m.pages.length}`;
					}

					if (window.Prism) Prism.highlightAll();
					status.textContent = `${m.pages.length + 3} pages ready`;
					btn.disabled = false;
					window.print();
				} catch (err) {
					status.textContent = "Error: " + err.message;
					btn.disabled = false;
				}
			});
		</script>
	</body>
</html>
