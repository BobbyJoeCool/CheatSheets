<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>React Reference — Table of Contents</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<style>
			/* ═══════════════════════════════════════════════════════
       INDEX PAGE — compact single-page TOC, manifest-driven
       Reusable for any language: only the manifest.json changes.
       ═══════════════════════════════════════════════════════ */

			/* ── Page shell: matches cheatsheet body exactly ─────── */
			body {
				width: var(--page-width);
				height: var(--page-height);
				margin: 20px auto;
				background: var(--bg-body);
				padding: 0.2in 0.25in calc(var(--footer-height) + 0.3in);
				font-size: 12px;
				font-family: var(--font-body);
				color: var(--text-primary);
				display: flex;
				flex-direction: column;
				box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
				box-sizing: border-box;
				overflow-x: hidden;
				position: relative;
			}

			/* ── Header ───────────────────────────────────────────── */
			.page-header {
				height: var(--header-height);
				display: flex;
				align-items: center;
				gap: 14px;
				margin-bottom: 12px;
				border-bottom: 1px solid var(--accent-primary);
				flex-shrink: 0;
			}
			.page-header .sheet-number {
				font-family: var(--font-code);
				font-size: 12px;
				color: var(--accent-purple);
				background: rgba(126, 87, 194, 0.15);
				border: 1px solid rgba(126, 87, 194, 0.3);
				border-radius: 4px;
				padding: 3px 10px;
				white-space: nowrap;
			}
			.page-header h1 {
				font-size: 26px;
				font-weight: 700;
				letter-spacing: -0.5px;
				color: var(--text-primary);
				flex: 1;
				text-align: center;
				margin: 0;
			}
			.page-header .sheet-desc {
				font-family: var(--font-code);
				font-size: 12px;
				color: var(--text-muted);
				text-align: right;
				white-space: nowrap;
			}

			/* ── Two-column layout for groups ─────────────────────── */
			#toc-columns {
				flex: 1;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 0 0.2in;
				align-content: start;
				overflow: hidden;
			}

			/* ── Group block ─────────────────────────────────────── */
			.toc-group {
				break-inside: avoid;
				margin-bottom: 10px;
			}

			/* Group header bar */
			.toc-group-head {
				display: flex;
				align-items: baseline;
				gap: 10px;
				padding: 4px 10px;
				background: rgba(92, 107, 192, 0.12);
				border-left: 3px solid var(--accent-primary);
				border-radius: 0 3px 3px 0;
				margin-bottom: 4px;
			}
			.toc-group-head .g-name {
				font-size: 13px;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--accent-purple);
			}
			.toc-group-head .g-range {
				font-family: var(--font-code);
				font-size: 11px;
				color: var(--text-muted);
				margin-left: auto;
			}

			/* ── Sheet entries — 3-up grid ───────────────────────── */
			.toc-entries {
				display: grid;
				grid-template-columns: 1fr 1fr 1fr;
				gap: 3px;
			}

			.toc-entry {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 3px 7px 3px 5px;
				border: 1px solid var(--border-section);
				border-radius: 3px;
				background: var(--bg-section);
				text-decoration: none;
				color: inherit;
				overflow: hidden;
				transition:
					border-color 0.12s,
					background 0.12s;
			}
			.toc-entry:hover {
				border-color: var(--accent-primary);
				background: rgba(92, 107, 192, 0.08);
			}

			/* Sheet number badge */
			.toc-num {
				flex-shrink: 0;
				font-family: var(--font-code);
				font-size: 11px;
				font-weight: 700;
				color: var(--accent-purple);
				background: rgba(126, 87, 194, 0.12);
				border: 1px solid rgba(126, 87, 194, 0.2);
				border-radius: 2px;
				padding: 1px 4px;
				line-height: 17px;
			}

			/* Sheet title */
			.toc-title {
				font-size: 12px;
				font-weight: 500;
				color: var(--text-primary);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.3;
			}

			/* Error state */
			#toc-error {
				color: #e57373;
				font-family: var(--font-code);
				font-size: 12px;
				padding: 1rem;
				display: none;
			}

			/* ── Footer nav ───────────────────────────────────────── */
			.page-footer {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				height: var(--footer-height);
				padding: 0 0.25in;
				display: flex;
				align-items: center;
				border-top: 1px solid var(--border-section);
				background: var(--bg-body);
			}
			.page-footer nav {
				display: flex;
				width: 100%;
				align-items: center;
				justify-content: space-between;
			}
			.nav-link,
			.nav-toc {
				font-family: var(--font-code);
				font-size: 12px;
				color: var(--text-link);
				text-decoration: none;
			}
			.nav-toc {
				color: var(--text-muted);
			}
			.nav-link.prev::before {
				content: "‹ ";
			}
			.nav-link.next::after {
				content: " ›";
			}

			/* ── Print ────────────────────────────────────────────── */
			@media print {
				body {
					margin: 0;
					box-shadow: none;
				}
				.toc-entry {
					border-color: rgba(0, 0, 0, 0.1);
				}
			}

			/* ── Mobile ───────────────────────────────────────────── */
			@media screen and (max-width: 767px) {
				body {
					width: 100%;
					height: auto;
					overflow: visible;
					padding: 12px 10px 60px;
					box-shadow: none;
				}
				#toc-columns {
					grid-template-columns: 1fr;
				}
				.toc-entries {
					grid-template-columns: 1fr 1fr;
				}
				.page-footer {
					position: fixed;
				}
			}
		</style>
	</head>
	<body>
		<!-- ══════════════════════════════════════ HEADER
       Populated by script once manifest loads. -->
		<header class="page-header">
			<div class="sheet-number" id="hdr-lang">Reference</div>
			<h1 id="hdr-title">Table of Contents</h1>
			<div class="sheet-desc" id="hdr-desc">loading…</div>
			<a id="print-all-btn" href="print-all.html">Print All</a>
		</header>

		<!-- ══════════════════════════════════════ MAIN -->
		<main id="toc-columns" aria-label="Table of contents">
			<!-- Built entirely by script -->
		</main>
		<div id="toc-error">Error loading manifest.json — check the console.</div>

		<!-- ══════════════════════════════════════ FOOTER -->
		<footer class="page-footer">
			<nav aria-label="Sheet navigation">
				<span class="nav-link prev" style="visibility: hidden">—</span>
				<a class="nav-toc" id="ftr-toc" href="index.html">Reference</a>
				<a class="nav-link next" id="ftr-first" href="#">Sheet 01</a>
			</nav>
		</footer>

		<script>
			/* ═══════════════════════════════════════════════════════
       manifest.json schema expected:
       {
         "title":  "React Reference",         // used in header & footer
         "lang":   "react",                   // used in header badge
         "count":  45,                        // total sheet count
         "groups": [                          // drives the two-column TOC
           { "title": "Group Name", "sheets": [1, 2, 3] },
           ...
         ],
         "pages": [                           // sequential list, 1-indexed
           { "file": "react-01-…html", "title": "…", "desc": "…" },
           ...
         ]
       }

       If "groups" is absent the script falls back to rendering
       all pages as a single flat list (backward-compatible with
       the original flat manifest format).
       ═══════════════════════════════════════════════════════ */

			document.addEventListener("DOMContentLoaded", async () => {
				// ── 1. Fetch manifest ────────────────────────────────
				let manifest;
				try {
					const res = await fetch("manifest.json");
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					manifest = await res.json();
				} catch (err) {
					document.getElementById("toc-error").style.display = "block";
					document.getElementById("toc-columns").style.display = "none";
					document.getElementById("hdr-desc").textContent =
						"Error loading manifest";
					console.error("manifest.json load error:", err);
					return;
				}

				const {
					title = "Reference",
					lang = "",
					count,
					pages = [],
					groups,
				} = manifest;
				const totalSheets = count ?? pages.length;

				// ── 2. Populate header & footer ───────────────────────
				document.title = `${title} — Table of Contents`;
				document.getElementById("hdr-lang").textContent =
					lang.toUpperCase() || title;
				document.getElementById("hdr-title").textContent = "Table of Contents";
				document.getElementById("hdr-desc").textContent =
					`${totalSheets} sheets · syntax · examples · notes`;
				document.getElementById("ftr-toc").textContent =
					`${title} · ${totalSheets} Sheets`;

				if (pages.length) {
					const firstLink = document.getElementById("ftr-first");
					firstLink.href = pages[0].file;
					firstLink.textContent = pages[0].title;
				}

				// ── 3. Build lookup: sheet number → page object ───────
				//    Sheets are numbered from 1 in groups; pages[] is 0-indexed.
				const byNum = {};
				pages.forEach((p, i) => {
					byNum[i + 1] = p;
				});

				// ── 4. Decide layout mode ─────────────────────────────
				const container = document.getElementById("toc-columns");

				if (groups && groups.length) {
					buildGrouped(container, groups, byNum, totalSheets);
				} else {
					buildFlat(container, pages);
				}
			});

			/* ── Grouped mode: two-column, groups from manifest ──── */
			function buildGrouped(container, groups, byNum, totalSheets) {
				// Split groups roughly evenly by sheet count into two columns.
				// Strategy: walk groups summing sheets; once we pass half the
				// total sheet count, start the second column.
				const half = Math.ceil(totalSheets / 2);
				let running = 0;
				let col1Done = false;

				// Create both column containers upfront so CSS grid places them
				// We don't need explicit col divs — the two-column grid on
				// #toc-columns already does the layout. We just append groups
				// in order and let the grid handle columns.
				// BUT: to keep groups from splitting mid-way we need to signal
				// the column break. We do this by inserting a "column spacer"
				// div that forces subsequent groups to the second column.

				// Actually the simplest reliable approach: count sheets per group,
				// split into two arrays, wrap each in a column div.
				const col1Groups = [];
				const col2Groups = [];
				for (const g of groups) {
					const sheetCount = g.sheets.length;
					if (!col1Done && running + sheetCount <= half + 2) {
						col1Groups.push(g);
						running += sheetCount;
					} else {
						col1Done = true;
						col2Groups.push(g);
					}
				}

				// If one column is empty (tiny set), put everything in col1
				if (!col2Groups.length) {
					col1Groups.splice(0);
					for (const g of groups) col1Groups.push(g);
				}

				// Render
				container.appendChild(buildColumn(col1Groups, byNum));
				container.appendChild(buildColumn(col2Groups, byNum));
			}

			function buildColumn(groupList, byNum) {
				const col = document.createElement("div");
				col.style.cssText =
					"display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;";

				for (const g of groupList) {
					// Resolve pages for this group
					const groupPages = g.sheets
						.map((n) => (byNum[n] ? { num: n, ...byNum[n] } : null))
						.filter(Boolean);

					if (!groupPages.length) continue;

					const firstNum = g.sheets[0];
					const lastNum = g.sheets[g.sheets.length - 1];
					const rangeStr =
						firstNum === lastNum
							? String(firstNum).padStart(2, "0")
							: `${String(firstNum).padStart(2, "0")} – ${String(lastNum).padStart(2, "0")}`;

					// Group container
					const group = document.createElement("div");
					group.className = "toc-group";

					// Group header
					const head = document.createElement("div");
					head.className = "toc-group-head";
					head.innerHTML =
						`<span class="g-name">${escHtml(g.title)}</span>` +
						`<span class="g-range">${rangeStr}</span>`;
					group.appendChild(head);

					// Sheet entries grid
					const entries = document.createElement("div");
					entries.className = "toc-entries";

					for (const p of groupPages) {
						const a = document.createElement("a");
						a.className = "toc-entry";
						a.href = p.file;
						a.title = p.desc || p.title; // full desc on hover
						a.innerHTML =
							`<span class="toc-num">${String(p.num).padStart(2, "0")}</span>` +
							`<span class="toc-title">${escHtml(p.title)}</span>`;
						entries.appendChild(a);
					}

					group.appendChild(entries);
					col.appendChild(group);
				}
				return col;
			}

			/* ── Flat fallback: one group, all pages ──────────────── */
			function buildFlat(container, pages) {
				// Override the two-column grid to single column for flat layout
				container.style.gridTemplateColumns = "1fr";
				const col = buildColumn(
					[{ title: "All Sheets", sheets: pages.map((_, i) => i + 1) }],
					Object.fromEntries(pages.map((p, i) => [i + 1, p])),
				);
				// In flat mode make entries wrap in more columns
				const entries = col.querySelector(".toc-entries");
				if (entries)
					entries.style.gridTemplateColumns =
						"repeat(auto-fill, minmax(160px,1fr))";
				container.appendChild(col);
			}

			/* ── Utility ──────────────────────────────────────────── */
			function escHtml(str) {
				return String(str)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/"/g, "&quot;");
			}
		</script>
	</body>
</html>
