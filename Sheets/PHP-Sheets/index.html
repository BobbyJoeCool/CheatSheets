<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			LARGE-MODEL INDEX TEMPLATE
			==========================
			Use for sheet sets with 25+ sheets that need a grouped,
			single-page TOC. The entire page is driven by manifest.json —
			nothing in this file needs to change between languages.

			Checklist when copying to a new language folder:
			  ✔ Copy this file as-is to [lang]/index.html
			  ✔ Copy MANIFEST_LARGE_TEMPLATE.json as manifest.json
			  ✔ Fill in manifest.json: title, lang, count, groups, pages
			  ✔ That's it — the script reads everything else from the manifest.

			For small sets (< 25 sheets) use INDEX_TEMPLATE.html instead.
		-->
		<title>PHP Reference — Table of Contents</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<style>
			/* ══════════════════════════════════════════════════════════
			   LARGE-MODEL INDEX — compact grouped single-page TOC
			   All layout is driven by manifest.json groups[].
			   Do not hardcode sheet entries here.
			   ══════════════════════════════════════════════════════════ */

			/* ── Page shell: matches cheatsheet body exactly ───────── */
			body {
				width: var(--page-width);
				height: var(--page-height);
				margin: 20px auto;
				background: var(--bg-body);
				padding: 0.2in 0.25in calc(var(--footer-height) + 0.3in);
				font-size: 10px;
				font-family: var(--font-body);
				color: var(--text-primary);
				-webkit-font-smoothing: antialiased;
				display: flex;
				flex-direction: column;
				box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
				box-sizing: border-box;
				overflow: hidden;
				position: relative;
			}

			/* ── Header ─────────────────────────────────────────────── */
			.page-header {
				height: var(--header-height);
				display: flex;
				align-items: center;
				gap: 12px;
				margin-bottom: 10px;
				border-bottom: 1px solid var(--accent-primary);
				flex-shrink: 0;
			}
			.page-header .sheet-number {
				font-family: var(--font-code);
				font-size: 10px;
				color: var(--accent-purple);
				background: rgba(126, 87, 194, 0.15);
				border: 1px solid rgba(126, 87, 194, 0.3);
				border-radius: 4px;
				padding: 2px 8px;
				white-space: nowrap;
				flex-shrink: 0;
			}
			.page-header h1 {
				font-size: 22px;
				font-weight: 700;
				letter-spacing: -0.5px;
				color: var(--text-primary);
				flex: 1;
				text-align: center;
				margin: 0;
			}
			.page-header .sheet-desc {
				font-family: var(--font-code);
				font-size: 10px;
				color: var(--text-muted);
				text-align: right;
				white-space: nowrap;
				flex-shrink: 0;
			}

			/* ── Two-column layout ──────────────────────────────────── */
			/*
			   The script wraps all groups into exactly two column divs
			   which this grid places side-by-side. Each column is a
			   flex-column of .toc-group blocks.
			*/
			#toc-columns {
				flex: 1;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 0 0.2in;
				align-content: start;
				overflow: hidden;
				min-height: 0;
			}

			/* ── Group block ────────────────────────────────────────── */
			.toc-group {
				break-inside: avoid;
				margin-bottom: 7px;
			}

			/*
			   Group header: coloured left-border bar with name + range.
			   Visually matches the section-title style used in sheets.
			*/
			.toc-group-head {
				display: flex;
				align-items: baseline;
				gap: 7px;
				padding: 3px 7px;
				background: rgba(92, 107, 192, 0.12);
				border-left: 3px solid var(--accent-primary);
				border-radius: 0 3px 3px 0;
				margin-bottom: 3px;
			}
			.toc-group-head .g-name {
				font-size: 9px;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--accent-purple);
			}
			.toc-group-head .g-range {
				font-family: var(--font-code);
				font-size: 8px;
				color: var(--text-muted);
				margin-left: auto;
			}

			/* ── Sheet entry chips — 3 per row ──────────────────────── */
			/*
			   Three chips per row keeps even a 6-sheet group to two rows.
			   Each chip is a small bordered box: number badge + title.
			   The title truncates with ellipsis if too long.
			*/
			.toc-entries {
				display: grid;
				grid-template-columns: 1fr 1fr 1fr;
				gap: 2px;
			}

			.toc-entry {
				display: flex;
				align-items: center;
				gap: 4px;
				padding: 2px 5px 2px 4px;
				border: 1px solid var(--border-section);
				border-radius: 3px;
				background: var(--bg-section);
				text-decoration: none;
				color: inherit;
				overflow: hidden;
				transition: border-color 0.12s, background 0.12s;
			}
			.toc-entry:hover {
				border-color: var(--accent-primary);
				background: rgba(92, 107, 192, 0.08);
			}

			/* Sheet number badge */
			.toc-num {
				flex-shrink: 0;
				font-family: var(--font-code);
				font-size: 7.5px;
				font-weight: 700;
				color: var(--accent-purple);
				background: rgba(126, 87, 194, 0.12);
				border: 1px solid rgba(126, 87, 194, 0.2);
				border-radius: 2px;
				padding: 0 3px;
				line-height: 14px;
				letter-spacing: 0.02em;
			}

			/* Sheet title — truncates gracefully */
			.toc-title {
				font-size: 8px;
				font-weight: 500;
				color: var(--text-primary);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.3;
			}

			/* ── Error state ────────────────────────────────────────── */
			#toc-error {
				display: none;
				color: #e57373;
				font-family: var(--font-code);
				font-size: 10px;
				padding: 1rem;
			}

			/* ── Footer nav ─────────────────────────────────────────── */
			.page-footer {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				height: var(--footer-height);
				padding: 0 0.25in;
				display: flex;
				align-items: center;
				border-top: 1px solid var(--border-section);
				background: var(--bg-body);
			}
			.page-footer nav {
				display: flex;
				width: 100%;
				align-items: center;
				justify-content: space-between;
			}
			.nav-link,
			.nav-toc {
				font-family: var(--font-code);
				font-size: 10px;
				text-decoration: none;
			}
			.nav-link { color: var(--text-link); }
			.nav-toc  { color: var(--text-muted); }
			.nav-link.prev::before { content: "‹ "; }
			.nav-link.next::after  { content: " ›"; }

			/* ── Print ──────────────────────────────────────────────── */
			@media print {
				@page { size: letter portrait; margin: 0; }
				body   { margin: 0; box-shadow: none; }
				.toc-entry { border-color: rgba(0, 0, 0, 0.1); }
			}

			/* ── Mobile ─────────────────────────────────────────────── */
			@media screen and (max-width: 767px) {
				body {
					width: 100%;
					height: auto;
					overflow: visible;
					padding: 12px 10px 60px;
					box-shadow: none;
				}
				#toc-columns   { grid-template-columns: 1fr; }
				.toc-entries   { grid-template-columns: 1fr 1fr; }
				.page-footer   { position: fixed; }
			}
		</style>
	</head>
	<body>

		<!-- ═══════════════════════════════════════════════════════
		HEADER — all text injected by script from manifest.json.
		The static fallback text ("Reference", "loading…") is
		replaced immediately once the manifest loads.
		════════════════════════════════════════════════════════════ -->
		<header class="page-header">
			<div class="sheet-number" id="hdr-lang">Reference</div>
			<h1 id="hdr-title">Table of Contents</h1>
			<div class="sheet-desc" id="hdr-desc">loading…</div>
			<a id="print-all-btn" href="print-all.html">Print All</a>
		</header>

		<!-- ═══════════════════════════════════════════════════════
		MAIN — built entirely by the script. Do not add any HTML here.
		The two column divs are created and appended by buildGrouped().
		════════════════════════════════════════════════════════════ -->
		<main id="toc-columns" aria-label="Table of contents"></main>
		<div id="toc-error">Error loading manifest.json — see browser console for details.</div>

		<!-- ═══════════════════════════════════════════════════════
		FOOTER — injected by script.
		════════════════════════════════════════════════════════════ -->
		<footer class="page-footer">
			<nav aria-label="Sheet navigation">
				<span class="nav-link prev" style="visibility: hidden">—</span>
				<a class="nav-toc" id="ftr-toc" href="index.html">Reference</a>
				<a class="nav-link next" id="ftr-first" href="#">Sheet 01</a>
			</nav>
		</footer>

		<!-- ═══════════════════════════════════════════════════════
		SCRIPT
		========================================================

		manifest.json schema (large model):
		────────────────────────────────────
		{
		  "title":  "Python Reference",   ← header h1, footer label, browser tab
		  "lang":   "py",                 ← header badge (uppercased to "PY")
		  "count":  85,                   ← shown in header desc
		  "groups": [                     ← drives the two-column grouped TOC
		    {
		      "title": "Introduction & Setup",
		      "sheets": [1, 2, 3, 4]      ← 1-based indices into pages[]
		    },
		    ...
		  ],
		  "pages": [                      ← flat sequential list for print-all/cover
		    {
		      "file":  "py-01-introduction.html",
		      "title": "Introduction to Python",
		      "desc":  "history · philosophy · CPython · running scripts · REPL"
		    },
		    ...
		  ]
		}

		Column split logic:
		───────────────────
		The script walks groups[], accumulating sheet counts. Once the
		running total exceeds half of count (+ a 2-sheet buffer to avoid
		splitting a group at a bad seam), it starts the second column.
		This keeps both columns visually balanced regardless of how many
		groups or sheets the language has.

		Flat fallback:
		──────────────
		If manifest.json has no "groups" key (old flat-only format),
		the script renders all pages as a single auto-fill grid — fully
		backward-compatible with sets built against MANIFEST_TEMPLATE.json.
		════════════════════════════════════════════════════════════ -->
		<script>
			document.addEventListener("DOMContentLoaded", async () => {

				// ── 1. Load manifest ─────────────────────────────────────
				let manifest;
				try {
					const res = await fetch("manifest.json");
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					manifest = await res.json();
				} catch (err) {
					document.getElementById("toc-error").style.display = "block";
					document.getElementById("toc-columns").style.display = "none";
					document.getElementById("hdr-desc").textContent = "Error loading manifest";
					console.error("manifest.json load error:", err);
					return;
				}

				const { title = "Reference", lang = "", count, pages = [], groups } = manifest;
				const totalSheets = count ?? pages.length;

				// ── 2. Populate header & footer ──────────────────────────
				document.title = `${title} — Table of Contents`;
				document.getElementById("hdr-lang").textContent = lang.toUpperCase() || title;
				document.getElementById("hdr-title").textContent = "Table of Contents";
				document.getElementById("hdr-desc").textContent =
					`${totalSheets} sheets · syntax · examples · notes`;
				document.getElementById("ftr-toc").textContent =
					`${title} · ${totalSheets} Sheets`;

				if (pages.length) {
					const firstLink = document.getElementById("ftr-first");
					firstLink.href = pages[0].file;
					firstLink.textContent = pages[0].title;
				}

				// ── 3. Build lookup: 1-based sheet number → page object ──
				const byNum = {};
				pages.forEach((p, i) => { byNum[i + 1] = p; });

				// ── 4. Render ────────────────────────────────────────────
				const container = document.getElementById("toc-columns");

				if (groups && groups.length) {
					buildGrouped(container, groups, byNum, totalSheets);
				} else {
					buildFlat(container, pages);
				}
			});

			// ── Grouped layout ───────────────────────────────────────────
			// Splits groups[] into two roughly equal-sized column arrays,
			// then renders each column as a flex-column of group blocks.
			function buildGrouped(container, groups, byNum, totalSheets) {
				const half = Math.ceil(totalSheets / 2);
				let running = 0;
				let col1Done = false;
				const col1Groups = [];
				const col2Groups = [];

				for (const g of groups) {
					if (!col1Done && running + g.sheets.length <= half + 2) {
						col1Groups.push(g);
						running += g.sheets.length;
					} else {
						col1Done = true;
						col2Groups.push(g);
					}
				}

				// Edge case: all groups fit in col1 (tiny set)
				if (!col2Groups.length) {
					for (const g of groups) col2Groups.push(col1Groups.pop());
				}

				container.appendChild(buildColumn(col1Groups, byNum));
				container.appendChild(buildColumn(col2Groups, byNum));
			}

			// Builds one column div containing all its group blocks.
			function buildColumn(groupList, byNum) {
				const col = document.createElement("div");
				col.style.cssText =
					"display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;";

				for (const g of groupList) {
					// Resolve page objects for every sheet number in this group
					const groupPages = g.sheets
						.map(n => (byNum[n] ? { num: n, ...byNum[n] } : null))
						.filter(Boolean);

					if (!groupPages.length) continue;

					// Sheet range label: "01 – 04" or "45" for a single sheet
					const first = g.sheets[0];
					const last  = g.sheets[g.sheets.length - 1];
					const range = first === last
						? String(first).padStart(2, "0")
						: `${String(first).padStart(2, "0")} – ${String(last).padStart(2, "0")}`;

					// Group wrapper
					const group = document.createElement("div");
					group.className = "toc-group";

					// Group header bar
					const head = document.createElement("div");
					head.className = "toc-group-head";
					head.innerHTML =
						`<span class="g-name">${escHtml(g.title)}</span>` +
						`<span class="g-range">${range}</span>`;
					group.appendChild(head);

					// 3-up chip grid
					const entries = document.createElement("div");
					entries.className = "toc-entries";

					for (const p of groupPages) {
						const a = document.createElement("a");
						a.className = "toc-entry";
						a.href  = p.file;
						a.title = p.desc || p.title;  // full keywords on hover
						a.innerHTML =
							`<span class="toc-num">${String(p.num).padStart(2, "0")}</span>` +
							`<span class="toc-title">${escHtml(p.title)}</span>`;
						entries.appendChild(a);
					}

					group.appendChild(entries);
					col.appendChild(group);
				}

				return col;
			}

			// ── Flat fallback (no groups key in manifest) ────────────────
			// Renders all pages as a single auto-fill chip grid.
			// Backward-compatible with MANIFEST_TEMPLATE.json (flat) format.
			function buildFlat(container, pages) {
				container.style.gridTemplateColumns = "1fr";
				const byNum = Object.fromEntries(pages.map((p, i) => [i + 1, p]));
				const col = buildColumn(
					[{ title: "All Sheets", sheets: pages.map((_, i) => i + 1) }],
					byNum
				);
				const entries = col.querySelector(".toc-entries");
				if (entries) {
					entries.style.gridTemplateColumns = "repeat(auto-fill, minmax(160px, 1fr))";
				}
				container.appendChild(col);
			}

			// ── Utility: escape HTML special characters ──────────────────
			function escHtml(str) {
				return String(str)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/"/g, "&quot;");
			}
		</script>

	</body>
</html>
