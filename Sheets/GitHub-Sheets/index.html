<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Large-model index (INDEX_LARGE_TEMPLATE.html): grouped single-page TOC driven by manifest.json -->
		<title>GitHub Reference — Table of Contents</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<style>
			body { width: var(--page-width); height: var(--page-height); margin: 20px auto; background: var(--bg-body); padding: 0.2in 0.25in calc(var(--footer-height) + 0.3in); font-size: 10px; font-family: var(--font-body); color: var(--text-primary); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6); box-sizing: border-box; overflow: hidden; position: relative; }
			.page-header { height: var(--header-height); display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--accent-primary); flex-shrink: 0; }
			.page-header .sheet-desc { font-family: var(--font-code); white-space: nowrap; flex-shrink: 0; }
			
#toc-columns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in; align-content: start; overflow: hidden; min-height: 0; }
.toc-group { break-inside: avoid; margin-bottom: 7px; }
.toc-group-head { display: flex; align-items: baseline; gap: 7px; padding: 3px 7px; background: rgba(92, 107, 192, 0.12); border-left: 3px solid var(--accent-primary); border-radius: 0 3px 3px 0; margin-bottom: 3px; }
.toc-group-head .g-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-purple); }
.toc-group-head .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
.toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
.toc-entry { display: flex; align-items: center; gap: 4px; padding: 2px 5px 2px 4px; border: 1px solid var(--border-section); border-radius: 3px; background: var(--bg-section); text-decoration: none; color: inherit; overflow: hidden; }
.toc-entry:hover { border-color: var(--accent-primary); background: rgba(92, 107, 192, 0.08); }
.toc-num { flex-shrink: 0; font-family: var(--font-code); font-size: 7.5px; font-weight: 700; color: var(--accent-purple); background: rgba(126, 87, 194, 0.12); border: 1px solid rgba(126, 87, 194, 0.2); border-radius: 2px; padding: 0 3px; line-height: 14px; }
.toc-title { font-size: 8px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
@media print { .toc-entry { border-color: rgba(0, 0, 0, 0.1); } }

			#toc-error { display: none; color: #e57373; font-family: var(--font-code); font-size: 10px; padding: 1rem; }
			.page-footer { padding: 0 0.25in; }
			@media print { @page { size: letter portrait; margin: 0; } body { margin: 0; box-shadow: none; } }
			@media screen and (max-width: 767px) {
				body { width: 100%; height: auto; overflow: visible; padding: 12px 10px 60px; box-shadow: none; }
				#toc-columns { grid-template-columns: 1fr; }
				.toc-entries { grid-template-columns: 1fr 1fr; }
				.page-footer { position: fixed; }
			}
		</style>
	</head>
	<body>
		<header class="page-header">
			<div class="sheet-number" id="hdr-lang">Reference</div>
			<h1 id="hdr-title">Table of Contents</h1>
			<div class="sheet-desc" id="hdr-desc">loading…</div>
			<a id="print-all-btn" href="print-all.html">Print All</a>
		</header>

		<main id="toc-columns" aria-label="Table of contents"></main>
		<div id="toc-error">Error loading manifest.json — see browser console for details.</div>

		<footer class="page-footer">
			<nav aria-label="Sheet navigation">
				<span class="nav-link prev" style="visibility: hidden">—</span>
				<a class="nav-home" href="../../index.html" title="All cheat sheets">⌂ All Sheets</a>
				<a class="nav-toc" id="ftr-toc" href="index.html">Reference</a>
				<a class="nav-link next" id="ftr-first" href="#">Sheet 01</a>
			</nav>
		</footer>

		<script>
			
function escHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function buildColumn(groupList, byNum) {
	const col = document.createElement("div");
	col.style.cssText = "display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;";
	for (const g of groupList) {
		const first = g.sheets[0], last = g.sheets[g.sheets.length - 1];
		const pad = (n) => String(n).padStart(2, "0");
		const group = document.createElement("div");
		group.className = "toc-group";
		const head = document.createElement("div");
		head.className = "toc-group-head";
		head.innerHTML = `<span class="g-name">${escHtml(g.title)}</span><span class="g-range">${first === last ? pad(first) : pad(first) + " – " + pad(last)}</span>`;
		group.appendChild(head);
		const entries = document.createElement("div");
		entries.className = "toc-entries";
		for (const n of g.sheets) {
			const p = byNum[n];
			if (!p) continue;
			const a = document.createElement("a");
			a.className = "toc-entry";
			a.href = p.file;
			a.title = p.desc || p.title;
			a.innerHTML = `<span class="toc-num">${pad(n)}</span><span class="toc-title">${escHtml(p.title)}</span>`;
			entries.appendChild(a);
		}
		group.appendChild(entries);
		col.appendChild(group);
	}
	return col;
}
function buildGrouped(container, groups, pages) {
	const byNum = {};
	pages.forEach((p, i) => { byNum[i + 1] = p; });
	const half = Math.ceil(pages.length / 2);
	let running = 0, done = false;
	const c1 = [], c2 = [];
	for (const g of groups) {
		if (!done && running + g.sheets.length <= half + 2) { c1.push(g); running += g.sheets.length; }
		else { done = true; c2.push(g); }
	}
	container.appendChild(buildColumn(c1, byNum));
	container.appendChild(buildColumn(c2, byNum));
}

			document.addEventListener("DOMContentLoaded", async () => {
				let manifest;
				try {
					const res = await fetch("manifest.json");
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					manifest = await res.json();
				} catch (err) {
					document.getElementById("toc-error").style.display = "block";
					document.getElementById("toc-columns").style.display = "none";
					document.getElementById("hdr-desc").textContent = "Error loading manifest";
					console.error("manifest.json load error:", err);
					return;
				}
				const { title = "Reference", lang = "", count, pages = [], groups = [] } = manifest;
				const total = count ?? pages.length;
				document.title = `${title} — Table of Contents`;
				document.getElementById("hdr-lang").textContent = lang.toUpperCase() || title;
				document.getElementById("hdr-desc").textContent = `${total} sheets · syntax · examples · notes`;
				document.getElementById("ftr-toc").textContent = `${title} · ${total} Sheets`;
				const first = document.getElementById("ftr-first");
				first.href = pages[0].file;
				first.textContent = pages[0].title;
				buildGrouped(document.getElementById("toc-columns"), groups, pages);
			});
		</script>
	</body>
</html>
