<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GitHub Reference — Print All</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/gh-cheatsheet.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js" defer></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-graphql.min.js" defer></script>
		<link rel="stylesheet" href="../CSS/cover.css" />
		<link rel="stylesheet" href="../CSS/print-all.css" />
		<!-- Grouped TOC styles, scoped to the injected index page.
		     index.html's own <style> is NOT injected: its body rule would override print-all.css. -->
		<style>
			.sheet-page.toc-page { display: flex; flex-direction: column; }
			.sheet-page.toc-page .page-header { height: var(--header-height); display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--accent-primary); flex-shrink: 0; }
			.sheet-page.toc-page #print-all-btn, .sheet-page.toc-page #toc-error { display: none; }
			
.sheet-page #toc-columns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in; align-content: start; overflow: hidden; min-height: 0; }
.toc-group { break-inside: avoid; margin-bottom: 7px; }
.toc-group-head { display: flex; align-items: baseline; gap: 7px; padding: 3px 7px; background: rgba(92, 107, 192, 0.12); border-left: 3px solid var(--accent-primary); border-radius: 0 3px 3px 0; margin-bottom: 3px; }
.toc-group-head .g-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-purple); }
.toc-group-head .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
.toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
.toc-entry { display: flex; align-items: center; gap: 4px; padding: 2px 5px 2px 4px; border: 1px solid var(--border-section); border-radius: 3px; background: var(--bg-section); text-decoration: none; color: inherit; overflow: hidden; }
.toc-entry:hover { border-color: var(--accent-primary); background: rgba(92, 107, 192, 0.08); }
.toc-num { flex-shrink: 0; font-family: var(--font-code); font-size: 7.5px; font-weight: 700; color: var(--accent-purple); background: rgba(126, 87, 194, 0.12); border: 1px solid rgba(126, 87, 194, 0.2); border-radius: 2px; padding: 0 3px; line-height: 14px; }
.toc-title { font-size: 8px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
@media print { .toc-entry { border-color: rgba(0, 0, 0, 0.1); } }

		</style>
	</head>
	<body>
		<div id="print-bar">
			<a href="index.html" id="back-link">← Index</a>
			<span id="bar-title">GITHUB REFERENCE · PRINT ALL</span>
			<span id="status"></span>
			<button id="print-btn" type="button">Print All</button>
		</div>

		<div id="sheets-container"></div>

		<script>
			
function escHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function buildColumn(groupList, byNum) {
	const col = document.createElement("div");
	col.style.cssText = "display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;";
	for (const g of groupList) {
		const first = g.sheets[0], last = g.sheets[g.sheets.length - 1];
		const pad = (n) => String(n).padStart(2, "0");
		const group = document.createElement("div");
		group.className = "toc-group";
		const head = document.createElement("div");
		head.className = "toc-group-head";
		head.innerHTML = `<span class="g-name">${escHtml(g.title)}</span><span class="g-range">${first === last ? pad(first) : pad(first) + " – " + pad(last)}</span>`;
		group.appendChild(head);
		const entries = document.createElement("div");
		entries.className = "toc-entries";
		for (const n of g.sheets) {
			const p = byNum[n];
			if (!p) continue;
			const a = document.createElement("a");
			a.className = "toc-entry";
			a.href = p.file;
			a.title = p.desc || p.title;
			a.innerHTML = `<span class="toc-num">${pad(n)}</span><span class="toc-title">${escHtml(p.title)}</span>`;
			entries.appendChild(a);
		}
		group.appendChild(entries);
		col.appendChild(group);
	}
	return col;
}
function buildGrouped(container, groups, pages) {
	const byNum = {};
	pages.forEach((p, i) => { byNum[i + 1] = p; });
	const half = Math.ceil(pages.length / 2);
	let running = 0, done = false;
	const c1 = [], c2 = [];
	for (const g of groups) {
		if (!done && running + g.sheets.length <= half + 2) { c1.push(g); running += g.sheets.length; }
		else { done = true; c2.push(g); }
	}
	container.appendChild(buildColumn(c1, byNum));
	container.appendChild(buildColumn(c2, byNum));
}

			const btn = document.getElementById('print-btn');
			const status = document.getElementById('status');
			const container = document.getElementById('sheets-container');
			const parser = new DOMParser();

			async function injectPage(url, { styles = true } = {}) {
				const html = await fetch(url).then(r => r.text());
				const doc = parser.parseFromString(html, 'text/html');
				const wrapper = document.createElement('div');
				wrapper.className = 'sheet-page';
				const bodyId = doc.body.getAttribute('id');
				if (bodyId) wrapper.id = bodyId;
				wrapper.innerHTML = doc.body.innerHTML;
				wrapper.querySelectorAll('script').forEach(s => s.remove());
				return wrapper;
			}

			let loaded = false;

			async function printAll() {
				if (loaded) { window.print(); return; }
				btn.disabled = true;
				status.textContent = 'Loading…';
				container.innerHTML = '';
				try {
					const manifest = await fetch('manifest.json').then(r => r.json());
					const { pages, groups, title } = manifest;

					// 1. Cover
					const cover = await injectPage('cover.html');
					cover.classList.add('cover-page');
					container.appendChild(cover);

					// 2. Blank page
					const blank = document.createElement('div');
					blank.className = 'sheet-page';
					container.appendChild(blank);

					// 3. Grouped TOC
					const toc = await injectPage('index.html');
					toc.classList.add('toc-page');
					toc.querySelector('#hdr-lang').textContent = 'GITHUB';
					toc.querySelector('#hdr-desc').textContent = `${pages.length} sheets · syntax · examples · notes`;
					toc.querySelector('#ftr-toc').textContent = `${title} · ${pages.length} Sheets`;
					const first = toc.querySelector('#ftr-first');
					first.textContent = pages[0].title;
					buildGrouped(toc.querySelector('#toc-columns'), groups, pages);
					container.appendChild(toc);

					// 4. Sheets
					for (let i = 0; i < pages.length; i++) {
						container.appendChild(await injectPage(pages[i].file));
						status.textContent = `${i + 1} / ${pages.length}`;
					}

					if (window.Prism) Prism.highlightAll();
					// Total = cover (1) + blank (1) + toc (1) + sheets
					loaded = true;
					void document.body.offsetHeight;
					await document.fonts.ready;
					status.textContent = `${pages.length + 3} pages ready`;
					btn.disabled = false;
					window.print();
				} catch (err) {
					status.textContent = 'Error: ' + err.message;
					btn.disabled = false;
				}
			}

			btn.addEventListener('click', printAll);
			document.addEventListener('DOMContentLoaded', printAll);
		</script>
	</body>
</html>
