<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Coding Concepts Reference — Table of Contents</title>
	<link rel="stylesheet" href="../CSS/cheatsheet.css" />
	<link rel="stylesheet" href="../CSS/concepts-cheatsheet.css" />
</head>
<body id="toc">

	<header class="page-header">
		<div class="sheet-number">Concepts Reference</div>
		<h1>Table of Contents</h1>
		<div class="sheet-desc" id="toc-count"></div>
	</header>

	<main class="toc" id="concepts-toc">
		<nav aria-label="Concepts reference sheets" id="toc-nav"></nav>
	</main>

	<footer class="page-footer">
		<nav aria-label="Sheet navigation">
			<span></span>
			<span class="nav-toc" id="toc-footer-label"></span>
			<a class="nav-link next" id="toc-first-link" href="#">—</a>
		</nav>
	</footer>

	<script>
		document.addEventListener("DOMContentLoaded", async () => {
			try {
				const { pages } = await fetch("manifest.json").then(r => r.json());
				const count = pages.length;

				document.getElementById("toc-count").textContent =
					`${count} reference sheets · algorithms · data structures · design`;

				document.getElementById("toc-footer-label").textContent =
					`Concepts Reference · ${count} sheets`;

				const firstLink = document.getElementById("toc-first-link");
				firstLink.href = pages[0].file;
				firstLink.textContent = pages[0].title;

				const nav = document.getElementById("toc-nav");
				pages.forEach((page, i) => {
					const a = document.createElement("a");
					a.id = `toc_entry_${i + 1}`;
					a.href = page.file;
					a.className = "toc_entry";

					const h2 = document.createElement("h2");
					h2.textContent = `Sheet ${String(i + 1).padStart(2, "0")}`;

					const h3 = document.createElement("h3");
					h3.textContent = page.title;

					const p = document.createElement("p");
					p.textContent = page.desc;

					a.append(h2, h3, p);
					nav.appendChild(a);
				});
			} catch (err) {
				document.getElementById("toc-nav").textContent =
					"Error loading manifest: " + err.message;
			}
		});
	</script>

</body>
</html>
