<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Programming Concepts Reference — Print All</title>
		<link rel="stylesheet" href="../CSS/cheatsheet.css" />
		<link rel="stylesheet" href="../CSS/pc-cheatsheet.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
		<link rel="stylesheet" href="../CSS/cover.css" />
		<link rel="stylesheet" href="../CSS/print-all.css" />
		<style>
			/* Cover: fill the sheet edge to edge */
			.sheet-page.cover-sheet { padding: 0; }
			.sheet-page.cover-sheet .page { height: 100%; }
			/* Grouped TOC page — built here from manifest.json because the
			   large-model index builds itself with a script and its <style>
			   restyles <body>, so it can't be injected like a normal sheet. */
			.print-toc main { height: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.2in; align-content: start; }
			.print-toc .toc-col { display: flex; flex-direction: column; min-width: 0; }
			.print-toc .toc-group { margin-bottom: 4px; break-inside: avoid; }
			.print-toc .toc-group-head { display: flex; align-items: baseline; gap: 7px; padding: 3px 7px;
				background: rgba(92, 107, 192, 0.12); border-left: 3px solid var(--accent-primary);
				border-radius: 0 3px 3px 0; margin-bottom: 3px; }
			.print-toc .g-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-purple); }
			.print-toc .g-range { font-family: var(--font-code); font-size: 8px; color: var(--text-muted); margin-left: auto; }
			.print-toc .toc-entries { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
			.print-toc .toc-entry { display: flex; align-items: center; gap: 4px; padding: 1px 5px 1px 4px;
				border: 1px solid var(--border-section); border-radius: 3px; background: var(--bg-section); overflow: hidden; }
			.print-toc .toc-num { flex-shrink: 0; font-family: var(--font-code); font-size: 7.5px; font-weight: 700; color: var(--accent-purple);
				background: rgba(126, 87, 194, 0.12); border: 1px solid rgba(126, 87, 194, 0.2); border-radius: 2px; padding: 0 3px; line-height: 14px; }
			.print-toc .toc-title { font-size: 8px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.print-toc .page-header .sheet-desc { font-family: var(--font-code); }
		</style>
	</head>
	<body>
		<div id="print-bar">
			<a href="index.html" id="back-link">← Index</a>
			<span id="bar-title">PROGRAMMING CONCEPTS REFERENCE · PRINT ALL</span>
			<span id="status"></span>
			<button id="print-btn" type="button">Print All</button>
		</div>

		<div id="sheets-container"></div>

		<script>
			const btn = document.getElementById('print-btn');
			const status = document.getElementById('status');
			const container = document.getElementById('sheets-container');
			const parser = new DOMParser();
			const injectedStyles = new Set();
			const pad = n => String(n).padStart(3, '0');
			const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

			// Pseudocode grammar — each sheet defines this in an inline <script>,
			// which does not run when the sheet body is injected below.
			function definePseudo() {
				Prism.languages.pseudo = {
					comment: /\/\/.*/,
					string: { pattern: /"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/, greedy: true },
					keyword: /\b(?:function|return|if|else|while|for|each|in|to|down|step|do|repeat|until|break|continue|new|class|extends|implements|interface|abstract|static|private|public|protected|this|self|super|try|catch|finally|throw|yield|async|await|switch|case|default|match|const|let|var|import|lambda|of|and|or|not|div|mod|xor|shl|shr)\b/,
					boolean: /\b(?:true|false|null)\b/,
					function: /\b[A-Za-z_]\w*(?=\()/,
					number: /\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b|∞/,
					operator: /←|≠|≤|≥|==|!=|<=|>=|[-+*\/%<>=&|^~!]/,
					punctuation: /[{}[\];(),.:]/
				};
			}

			async function injectPage(url) {
				const html = await fetch(url).then(r => r.text());
				const doc = parser.parseFromString(html, 'text/html');
				doc.querySelectorAll('head style').forEach(style => {
					const key = style.textContent.trim().slice(0, 60);
					if (!injectedStyles.has(key)) {
						injectedStyles.add(key);
						const s = document.createElement('style');
						s.textContent = style.textContent;
						document.head.appendChild(s);
					}
				});
				const wrapper = document.createElement('div');
				wrapper.className = 'sheet-page';
				const bodyId = doc.body.getAttribute('id');
				if (bodyId) wrapper.id = bodyId;
				wrapper.innerHTML = doc.body.innerHTML;
				return wrapper;
			}

			function buildToc({ title, count, groups, pages }) {
				const page = document.createElement('div');
				page.className = 'sheet-page print-toc';
				const half = Math.ceil(count / 2);
				const cols = [[], []];
				let running = 0;
				for (const g of groups) {
					const target = cols[1].length || running + g.sheets.length > half + 2 ? 1 : 0;
					cols[target].push(g);
					if (target === 0) running += g.sheets.length;
				}
				const colHtml = cols.map(list => `<div class="toc-col">${list.map(g => {
					const a = g.sheets[0], b = g.sheets.at(-1);
					const entries = g.sheets.map(n => `<div class="toc-entry"><span class="toc-num">${pad(n)}</span>` +
						`<span class="toc-title">${esc(pages[n - 1].title)}</span></div>`).join('');
					return `<div class="toc-group"><div class="toc-group-head"><span class="g-name">${esc(g.title)}</span>` +
						`<span class="g-range">${a === b ? pad(a) : `${pad(a)} – ${pad(b)}`}</span></div><div class="toc-entries">${entries}</div></div>`;
				}).join('')}</div>`).join('');
				page.innerHTML =
					`<header class="page-header"><div class="sheet-number">Concepts</div><h1>Table of Contents</h1>` +
					`<div class="sheet-desc">${count} sheets · ${groups.length} sections</div></header>` +
					`<main>${colHtml}</main>` +
					`<footer class="page-footer"><nav><span></span><span class="nav-toc">${esc(title)} · ${count} Sheets</span><span></span></nav></footer>`;
				return page;
			}

			// Load everything and print. Runs when the page opens; the button re-prints
			// without reloading once everything is in place.
			let loaded = false;

			async function printAll() {
				if (loaded) {
					window.print();
					return;
				}
				btn.disabled = true;
				status.textContent = 'Loading…';
				container.innerHTML = '';

				try {
					const manifest = await fetch('manifest.json').then(r => r.json());
					const { pages } = manifest;

					// 1. Cover page
					const cover = await injectPage('cover.html');
					cover.classList.add('cover-sheet');
					container.appendChild(cover);

					// 2. Blank page
					const blank = document.createElement('div');
					blank.className = 'sheet-page';
					container.appendChild(blank);

					// 3. TOC — grouped, built from manifest.json
					container.appendChild(buildToc(manifest));

					// 4. Manifest pages
					for (let i = 0; i < pages.length; i++) {
						container.appendChild(await injectPage(pages[i].file));
						status.textContent = `${i + 1} / ${pages.length}`;
					}

					if (window.Prism) {
						definePseudo();
						Prism.highlightAll();
					}
					// Total = cover (1) + blank (1) + toc (1) + sheets
					loaded = true;
					// Force layout so the injected text requests its fonts, then wait for them
					void document.body.offsetHeight;
					await document.fonts.ready;
					status.textContent = `${pages.length + 3} pages ready`;
					btn.disabled = false;
					window.print();
				} catch (err) {
					status.textContent = 'Error: ' + err.message;
					btn.disabled = false;
				}
			}

			btn.addEventListener('click', printAll);
			// DOMContentLoaded fires after the deferred Prism scripts have run
			document.addEventListener('DOMContentLoaded', printAll);
		</script>
	</body>
</html>
